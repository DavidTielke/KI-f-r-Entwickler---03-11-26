services:
  backend:
    build:
      context: ./code/backend
      dockerfile: Dockerfile
    container_name: personen-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__PersonsDb: "Data Source=/app/data/persons.db"
    volumes:
      - persons-data:/app/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./code/frontend
      dockerfile: Dockerfile
    container_name: personen-web
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  persons-data:
